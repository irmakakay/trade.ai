services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantcore}
      POSTGRES_USER: ${POSTGRES_USER:-quant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quant_secret}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quant} -d ${POSTGRES_DB:-quantcore}"]
      interval: 3s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrations:
    build:
      context: ./migrations
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-quantcore}
      POSTGRES_USER: ${POSTGRES_USER:-quant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quant_secret}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  nn-worker:
    build:
      context: .
      dockerfile: src/quant_nn_worker/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-quantcore}
      POSTGRES_USER: ${POSTGRES_USER:-quant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quant_secret}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      QUANT_API_URL: http://quant-api:8080
      NN_HIDDEN_DIM: ${NN_HIDDEN_DIM:-128}
      POOL_REPLICATION_FACTOR: ${POOL_REPLICATION_FACTOR:-3}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.75}
      MIN_CONSECUTIVE_PROMOTED_GENS: ${MIN_CONSECUTIVE_PROMOTED_GENS:-2}
      OOS_LOOKBACK_EPISODES: ${OOS_LOOKBACK_EPISODES:-30}
      MIN_OOS_EPISODES: ${MIN_OOS_EPISODES:-15}
      MIN_OOS_SHARPE: ${MIN_OOS_SHARPE:-0.35}
      MIN_OOS_WIN_RATE: ${MIN_OOS_WIN_RATE:-0.55}
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  quant-api:
    build:
      context: .
      dockerfile: src/QuantCore.Api/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      POSTGRES_CONNECTION: Host=postgres;Port=5432;Database=${POSTGRES_DB:-quantcore};Username=${POSTGRES_USER:-quant};Password=${POSTGRES_PASSWORD:-quant_secret}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      BINANCE_WS_URL: ${BINANCE_WS_URL:-wss://stream.binance.com:9443/stream?streams=btcusdt@kline_1m/ethusdt@kline_1m/solusdt@kline_1m}
      POOL_REPLICATION_FACTOR: ${POOL_REPLICATION_FACTOR:-3}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.75}
      LOCK_TTL_SECONDS: ${LOCK_TTL_SECONDS:-5}
      CLAIM_TTL_SECONDS: ${CLAIM_TTL_SECONDS:-240}
      REAPER_INTERVAL_SECONDS: ${REAPER_INTERVAL_SECONDS:-15}
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  quant-agents:
    profiles: ["agents"]
    build:
      context: .
      dockerfile: src/QuantCore.Agents/Dockerfile
    restart: unless-stopped
    command: ["--mode", "agent"]
    environment:
      QUANT_API_URL: http://quant-api:8080
      QUANT_API_WS_URL: ws://quant-api:8080/api/v1/stream/live
      POSTGRES_CONNECTION: Host=postgres;Port=5432;Database=${POSTGRES_DB:-quantcore};Username=${POSTGRES_USER:-quant};Password=${POSTGRES_PASSWORD:-quant_secret}
      AGENT_PROFILE_KEY: ${AGENT_PROFILE_KEY:-ALL}
      EPISODE_SETTLEMENT_MODE: ${EPISODE_SETTLEMENT_MODE:-CARRY_POSITIONS}
      EPISODE_MAX_TICKS: ${EPISODE_MAX_TICKS:-120}
      EPISODE_MAX_SECONDS: ${EPISODE_MAX_SECONDS:-180}
      ENABLE_SIGNAL_ENTRY_GATE: ${ENABLE_SIGNAL_ENTRY_GATE:-true}
      ALLOW_SYNTHETIC_TRADING: ${ALLOW_SYNTHETIC_TRADING:-false}
      EXECUTION_GATEWAY: ${EXECUTION_GATEWAY:-SIMULATED}
      REVX_AUTH_PROVIDER: ${REVX_AUTH_PROVIDER:-FAKE}
      REVX_DRY_RUN: ${REVX_DRY_RUN:-true}
      REVX_TARGET_ORDER_USDT: ${REVX_TARGET_ORDER_USDT:-20}
      REVX_MAX_ORDER_USDT: ${REVX_MAX_ORDER_USDT:-25}
      REVX_MAX_EXIT_USDT: ${REVX_MAX_EXIT_USDT:-100}
      REVX_MIN_DELTA_USDT: ${REVX_MIN_DELTA_USDT:-10}
      REVX_MIN_LIVE_CONFIDENCE: ${REVX_MIN_LIVE_CONFIDENCE:-0.80}
      REVX_MIN_EDGE_BPS: ${REVX_MIN_EDGE_BPS:-5.0}
      REVX_MAKER_OFFSET_BPS: ${REVX_MAKER_OFFSET_BPS:-2.0}
      REVX_CHAMPION_REPLICA_INDEX: ${REVX_CHAMPION_REPLICA_INDEX:-1}
      REVX_API_BASE_URL: ${REVX_API_BASE_URL:-https://revx.revolut.com}
      REVX_API_KEY: ${REVX_API_KEY:-}
      REVX_PRIVATE_KEY_PEM: ${REVX_PRIVATE_KEY_PEM:-}
    depends_on:
      quant-api:
        condition: service_started
